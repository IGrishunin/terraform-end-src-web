version: '3.8'
include:
  - ./proxy.yaml
services:
  web:
    image: ${WEB_IMAGE}
    container_name: web
    restart: always
    networks:
      backend:
        ipv4_address: 172.20.0.5
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${MYSQL_USER:-}
      - DB_PASSWORD=${MYSQL_PASSWORD:-}
      - DB_NAME=${MYSQL_DATABASE:-}
